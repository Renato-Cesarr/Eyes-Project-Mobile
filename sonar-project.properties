sonar.projectKey=Renato-Cesarr_Eyes-Project-Mobile
sonar.organization=renato-cesarr
sonar.host.url=https://sonarcloud.io

sonar.sources=lib
sonar.tests=test
sonar.test.inclusions=test/**/*.dart

sonar.exclusions=lib/l10n/generated/**,**/*.g.dart,**/*.freezed.dart
# Material color schemes are explicit, auditable token tables. CPD treats the
# required light/dark field symmetry as copied logic, so only this data table is
# excluded from duplication detection; all other analysis remains enabled.
sonar.cpd.exclusions=lib/core/design_system/tokens/eyes_color_schemes.dart
sonar.coverage.exclusions=lib/l10n/generated/**,lib/bootstrap.dart,lib/main.dart,lib/main_dev.dart,lib/main_prod.dart
sonar.dart.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
sonar.working.directory=.scannerwork
