name: CI Mobile

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  quality:
    name: Build + Test + Sonar Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true

      - name: Validate pinned toolchains
        shell: pwsh
        run: ./scripts/check-toolchain.ps1 -Ci

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Validate coverage report
        run: test -s coverage/lcov.info

      - name: Build development APK
        run: flutter build apk --debug --flavor dev --target lib/main_dev.dart

      - name: Build production bundle
        run: >-
          flutter build appbundle --release --flavor prod
          --target lib/main_prod.dart
          --dart-define=API_BASE_URL=https://api.example.invalid

      - name: SonarQube Cloud analysis
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
